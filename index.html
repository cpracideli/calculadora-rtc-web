<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora RTC — Painel de Testes</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --ok: #22c55e;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .swagger-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .swagger-link:hover { border-color: var(--accent); }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 12px;
    }
    label:first-child { margin-top: 0; }
    input, textarea {
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88rem;
    }
    textarea { min-height: 220px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    button.btn {
      margin-top: 16px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button.btn:hover { background: var(--accent-hover); }
    button.btn:disabled { opacity: 0.6; cursor: wait; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-family: ui-monospace, monospace;
    }
    .badge.ok { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
    .badge.err { background: rgba(239, 68, 68, 0.15); color: var(--err); }
    pre {
      margin: 0;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      font-size: 0.85rem;
      max-height: 460px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Calculadora RTC — Painel de Testes</h1>
        <div class="subtitle">Reforma Tributária do Consumo (CBS, IBS e Imposto Seletivo)</div>
      </div>
      <a class="swagger-link" href="https://calculadora-rtc.137.131.175.211.sslip.io/api/swagger-ui.html" target="_blank" rel="noopener">
        Abrir Swagger UI ↗
      </a>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="regime">Cálculo Regime Geral (POST)</button>
      <button class="tab" data-tab="nbs">Consulta NBS (GET)</button>
      <button class="tab" data-tab="cst">Situações Tributárias (GET)</button>
      <button class="tab" data-tab="aliquota">Alíquota União (GET)</button>
    </div>

    <div class="card">
      <div id="panel-regime" class="panel active">
        <label for="regime-body">Payload JSON (<code>POST /api/calculadora/regime-geral</code>)</label>
        <textarea id="regime-body">{
  "id": "teste-001",
  "versao": "0.0.1",
  "dataHoraEmissao": "2027-01-01T10:00:00-03:00",
  "municipio": 3550308,
  "uf": "SP",
  "itens": [
    {
      "numero": 1,
      "ncm": "84713012",
      "cst": "000",
      "cClassTrib": "000001",
      "baseCalculo": 1000.00,
      "quantidade": 1,
      "unidade": "UN"
    }
  ]
}</textarea>
        <button class="btn" onclick="runRequest('POST', '/api/calculadora/regime-geral', document.getElementById('regime-body').value)">
          Calcular Tributos
        </button>
      </div>

      <div id="panel-nbs" class="panel">
        <div class="row">
          <div>
            <label for="nbs-code">Código NBS</label>
            <input id="nbs-code" value="101011100" />
          </div>
          <div>
            <label for="nbs-date">Data (YYYY-MM-DD)</label>
            <input id="nbs-date" value="2027-01-01" />
          </div>
        </div>
        <button class="btn" onclick="runRequest('GET', `/api/calculadora/dados-abertos/nbs?nbs=${encodeURIComponent(document.getElementById('nbs-code').value)}&data=${encodeURIComponent(document.getElementById('nbs-date').value)}`)">
          Consultar NBS
        </button>
      </div>

      <div id="panel-cst" class="panel">
        <label for="cst-date">Data (YYYY-MM-DD)</label>
        <input id="cst-date" value="2027-01-01" />
        <button class="btn" onclick="runRequest('GET', `/api/calculadora/dados-abertos/situacoes-tributarias/cbs-ibs?data=${encodeURIComponent(document.getElementById('cst-date').value)}`)">
          Listar Situações Tributárias CBS/IBS
        </button>
      </div>

      <div id="panel-aliquota" class="panel">
        <label for="aliq-date">Data (YYYY-MM-DD)</label>
        <input id="aliq-date" value="2027-01-01" />
        <button class="btn" onclick="runRequest('GET', `/api/calculadora/dados-abertos/aliquota-uniao?data=${encodeURIComponent(document.getElementById('aliq-date').value)}`)">
          Consultar Alíquota União
        </button>
      </div>
    </div>

    <div class="card">
      <div class="result-header">
        <span>Resposta da API</span>
        <span id="status-info" style="color: var(--muted);">Aguardando requisição...</span>
      </div>
      <pre id="output">{}</pre>
    </div>
  </div>

  <script>
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    async function runRequest(method, url, body = null) {
      const statusEl = document.getElementById('status-info');
      const outputEl = document.getElementById('output');
      statusEl.innerHTML = 'Enviando...';
      const t0 = performance.now();
      try {
        const opts = { method, headers: {} };
        if (body) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = body;
        }
        const res = await fetch(url, opts);
        const ms = Math.round(performance.now() - t0);
        const text = await res.text();
        let formatted = text;
        try {
          formatted = JSON.stringify(JSON.parse(text), null, 2);
        } catch (_) {}
        const cls = res.ok ? 'ok' : 'err';
        statusEl.innerHTML = `<span class="badge ${cls}">HTTP ${res.status}</span> · ${ms} ms`;
        outputEl.textContent = formatted;
      } catch (err) {
        statusEl.innerHTML = `<span class="badge err">ERRO</span>`;
        outputEl.textContent = String(err);
      }
    }
  </script>
</body>
</html>
